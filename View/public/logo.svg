<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Box Gradients -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    
    <!-- Layer Chip Gradients -->
    <linearGradient id="chipTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="chipMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="chipBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Flap Gradients -->
    <linearGradient id="flapLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="flapRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow & Shadow filters -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Shadow Under Box -->
  <ellipse cx="100" cy="172" rx="65" ry="16" fill="#000000" fill-opacity="0.35"/>

  <!-- Back Flap -->
  <polygon points="100,52 136,36 100,24 64,36" fill="#1e3a8a" opacity="0.6"/>

  <!-- Layered Stack (Floating Modules inside box) -->
  <!-- Bottom Chip (Blue/Cyan) -->
  <g>
    <!-- Left face -->
    <polygon points="68,76 100,90 100,96 68,82" fill="#0284c7"/>
    <!-- Right face -->
    <polygon points="100,90 132,76 132,82 100,96" fill="#0369a1"/>
    <!-- Top face -->
    <polygon points="100,64 132,76 100,90 68,76" fill="url(#chipBot)"/>
  </g>

  <!-- Middle Chip (Teal) -->
  <g>
    <polygon points="68,61 100,75 100,81 68,67" fill="#0d9488"/>
    <polygon points="100,75 132,61 132,67 100,81" fill="#0f766e"/>
    <polygon points="100,49 132,61 100,75 68,61" fill="url(#chipMid)"/>
  </g>

  <!-- Top Chip (Mint Green) -->
  <g>
    <polygon points="68,46 100,60 100,66 68,52" fill="#059669"/>
    <polygon points="100,60 132,46 132,52 100,66" fill="#047857"/>
    <polygon points="100,34 132,46 100,60 68,46" fill="url(#chipTop)"/>
  </g>

  <!-- Isometric Open Package Box Body -->
  <!-- Left Side Face of Box -->
  <polygon points="46,84 100,108 100,166 46,140" fill="url(#boxLeft)"/>
  
  <!-- Right Side Face of Box -->
  <polygon points="100,108 154,84 154,140 100,166" fill="url(#boxRight)"/>

  <!-- Front Left Open Flap -->
  <polygon points="46,84 100,108 84,124 32,98" fill="url(#flapLeft)"/>

  <!-- Front Right Open Flap -->
  <polygon points="100,108 154,84 168,98 116,124" fill="url(#flapRight)"/>

  <!-- Left Open Wing Flap (Top side) -->
  <polygon points="46,84 32,58 56,50 68,74" fill="#3b82f6"/>

  <!-- Right Open Wing Flap (Top side) -->
  <polygon points="154,84 168,58 144,50 132,74" fill="#2563eb"/>

  <!-- Left Face Code Brackets Icon </ > -->
  <g transform="translate(62, 118)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M 0,2 L -8,7 L 0,12"/>
    <path d="M 16,2 L 24,7 L 16,12"/>
    <line x1="10" y1="1" x2="6" y2="13"/>
  </g>

  <!-- Right Face Telemetry Lines -->
  <g transform="translate(112, 118)" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="0" y1="2" x2="22" y2="2"/>
    <line x1="0" y1="7" x2="16" y2="7"/>
    <line x1="0" y1="12" x2="20" y2="12"/>
  </g>

  <!-- Verified Status Floating Badge -->
  <g filter="url(#badgeGlow)">
    <circle cx="150" cy="144" r="18" fill="#10b981"/>
    <circle cx="150" cy="144" r="15" fill="#059669"/>
    <!-- Checkmark -->
    <path d="M142 144 L147 149 L158 138" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
